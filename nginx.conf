server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # GeoJSON isn't in nginx's default mime.types
    location ~* \.geojson$ {
        default_type application/geo+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Long-cache static assets — safe because every reference carries a ?v=
    # cache-buster from index.html, which itself is never cached (below)
    location ~* \.(?:js|css|png|svg|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # PWA manifest (not in nginx's default mime.types)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        add_header Cache-Control "public";
    }

    # the entry point must NEVER be pinned: it carries the ?v= cache-busters
    # for everything else. Without this, a browser (or the CDN in front) can
    # hold a stale index.html for days and a redeploy looks like it did
    # nothing — new code, old data, or both.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # GeoJSON compresses ~10x — worth it
    gzip            on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json application/geo+json application/javascript text/css image/svg+xml;
}
