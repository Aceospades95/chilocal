# ChiLocal site — MEMBERS ONLY. Every request for the app, its code, and
# its data must present a valid session cookie; nginx asks the companion
# API (auth_request) and bounces strangers to the self-contained gate page.
# This file is an nginx TEMPLATE: ${API_UPSTREAM} is substituted from the
# container environment at startup (default set in the Dockerfile).

# proto forwarded to the API: pass through what the fronting proxy said
# (Cloudflare/NPM), fall back to our own scheme when we're the edge
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- one Cache-Control per response, chosen per location ------------
    # (locations set $cc; the single add_header below emits it — this keeps
    # every response to exactly one Cache-Control header, which matters
    # because a CDN that honors only the first would otherwise cache gated
    # bodies marked private in the second)
    set $cc "no-cache, private";
    add_header Cache-Control $cc always;

    # ---- security headers (server-wide; no location re-declares add_header,
    # so these inherit everywhere) ----------------------------------------
    # HSTS belongs on the TLS terminator (Cloudflare/NPM), not here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cartocdn.com https://server.arcgisonline.com; connect-src 'self' https://api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- the doorman: 204 lets you in, anything else is the gate --------
    location = /_auth {
        internal;
        proxy_pass http://${API_UPSTREAM}/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    # if the auth server is down, NOBODY gets in — locked means locked;
    # the gate page explains it can't reach the sign-in server
    location @gate { return 302 /gate.html; }

    # ---- the companion API, same-origin — sign-in works out of the box --
    # (an external proxy may route /api to the API directly instead; this
    # block makes the shipped compose stack complete on its own)
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        set $cc ""; # the API sets its own Cache-Control — don't double up
    }

    # ---- the only anonymous surfaces: the gate itself + branding --------
    location = /gate.html { set $cc "no-cache"; }
    # the privacy policy is deliberately public: people deserve to read it
    # BEFORE handing over an email address
    location = /privacy.html { set $cc "no-cache"; }
    location = /icon-192.png { set $cc "public, max-age=604800"; }
    location = /icon-512.png { set $cc "public, max-age=604800"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        set $cc "public, max-age=86400";
    }

    # ---- everything below requires a session ----------------------------
    # GeoJSON isn't in nginx's default mime.types
    location ~* \.geojson$ {
        auth_request /_auth;
        error_page 401 403 500 502 503 504 = @gate;
        default_type application/geo+json;
        # immutable is safe: every reference carries a ?v= cache-buster from
        # index.html, which itself is never cached (below). private keeps
        # shared caches (the CDN) from handing gated bodies to strangers.
        set $cc "private, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|svg|json)$ {
        auth_request /_auth;
        error_page 401 403 500 502 503 504 = @gate;
        set $cc "private, max-age=31536000, immutable";
    }

    # the entry point is never pinned: it carries every ?v= cache-buster
    location = /index.html {
        auth_request /_auth;
        error_page 401 403 500 502 503 504 = @gate;
    }

    location / {
        auth_request /_auth;
        error_page 401 403 500 502 503 504 = @gate;
        try_files $uri $uri/ /index.html;
    }

    # GeoJSON compresses ~10x — worth it
    gzip            on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json application/geo+json application/javascript text/css image/svg+xml;
}
